<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Aluno</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

        * {
            font-family: "Montserrat", sans-serif;
        }
    </style>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container-fluid p-5">
    <header class="container-fluid mt-3">
        <article class="fs-4">Formulário Aluno</article>
        <hr>
    </header>

    <form onsubmit="cadastrarAluno(event)" class="container-fluid p-5" name="form">
        <!-- Nome -->
        <div class="row mb-3">
            <div class="col-8">
                <label for="nome" class="form-text mb-2">Nome</label>
                <input type="text" id="nome" class="form-control" required>
            </div>
        </div>

        <!-- RA -->
        <div class="row mb-3">
            <div class="col-4">
                <label for="ra" class="form-text mb-2">RA</label>
                <input type="text" id="ra" class="form-control" required>
            </div>
        </div>

        <!-- Notas -->
        <div class="row mb-3">
            <div class="col-4">
                <label for="nota1" class="form-text mb-2">Nota1</label>
                <input type="number" id="nota1" class="form-control" required>
            </div>
            <div class="col-4">
                <label for="nota2" class="form-text mb-2">Nota2</label>
                <input type="number" id="nota2" class="form-control" required>
            </div>
            <div class="col-4">
                <label for="nota3" class="form-text mb-2">Nota3</label>
                <input type="number" id="nota3" class="form-control" required>
            </div>
        </div>

        <!-- Botões -->
        <div class="mt-3">
            <button class="btn btn-primary me-3" type="submit">Enviar</button><button class="btn btn-warning"
                onclick="mostrarMediaGeral()" type="button">Mostrar média geral</button>
        </div>
    </form>

    <header class="container-fluid mt-3">
        <article class="fs-4">Tabela de alunos</article>
        <hr>
    </header>

    <section class="container-fluid ps-5">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Nome</th>
                    <th scope="col">RA</th>
                    <th scope="col">Média</th>
                </tr>
            </thead>
            <tbody id="corpoTab">
            </tbody>
        </table>
    </section>

    <script src="script.js"></script>
</body>

</html>
