<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos FATEC</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

        * {
            font-family: "Montserrat", sans-serif;
        }
    </style>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header class="container-fluid text-center mt-3">
        <article class="fs-2">Cursos FATEC</article>
        <hr>
    </header>

    <section class="container-fluid mt-3 p-5">
        <select class="form-select" aria-label="Curso Select" id="cursos">
            <option selected>Selecione um curso</option>
            <option value="https://fatecsorocaba.cps.sp.gov.br/cursos-fatec/analise-e-desenvolvimento-de-sistemas/">
                Análise e Desenvolvimento de Sistemas</option>
            <option value="https://fatecsorocaba.cps.sp.gov.br/cursos-fatec/automacao-industrial/">Automação Industrial
            </option>
            <option value="https://fatecsorocaba.cps.sp.gov.br/cursos-fatec/eletronica-automotiva/">Eletrônica
                Automotiva</option>
            <option value="https://fatecsorocaba.cps.sp.gov.br/cursos-fatec/fabricacao-mecanica/">Fabricação Mecânica
            </option>
            <option value="https://fatecsorocaba.cps.sp.gov.br/cursos-fatec/gestao-da-qualidade/">Gestão da Qualidade
            </option>
            <option value="https://fatecsorocaba.cps.sp.gov.br/cursos-fatec/logistica/">Logística</option>
            <option value="https://fatecsorocaba.cps.sp.gov.br/cursos-fatec/manufatura-avancada/">Manufatura Avançada
            </option>
            <option value="https://fatecsorocaba.cps.sp.gov.br/cursos-fatec/manutencao-de-aeronaves/">Manutenção de
                Aeronaves</option>
            <option value="https://fatecsorocaba.cps.sp.gov.br/cursos-fatec/polimeros/">Polímeros</option>
            <option value="https://fatecsorocaba.cps.sp.gov.br/cursos-fatec/processos-metalurgicos/">Processos
                Metalúrgicos</option>
            <option value="https://fatecsorocaba.cps.sp.gov.br/cursos-fatec/projetos-mecanicos/">Projetos Mecânicos
            </option>
            <option value="https://fatecsorocaba.cps.sp.gov.br/cursos-fatec/sistemas-biomedicos/">Sistemas Biomédicos
            </option>
        </select>
    </section>

    <div class="container-fluid text-center" id="confirmacao" hidden>
        <p>Deseja visualizar o curso?</p>
        <button class="btn btn-primary me-3" onclick="mostrarCurso()">Sim</button><button class="btn btn-danger"
            onclick="fecharCaixa()">Não</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
