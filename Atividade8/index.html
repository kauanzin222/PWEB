<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Satisfação</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

        * {
            font-family: "Montserrat", sans-serif;
        }
    </style>
</head>

<body>

    <div class="fs-1 text-center mt-3">
        Formulário de Pesquisa
    </div>

    <form class="container mt-5 rounded shadow pb-4 pt-4 bg-light" onsubmit="cadOpiniao(event)" id="formPes">

        <!-- IDADE  -->
        <div class="row mb-3">
            <label for="idadeInput" class="col-sm-2">Informe a Idade:</label>
            <input type="number" class="col-sm-2" id="idadeInput" required>
        </div>

        <!-- Radio Sexo -->
        <label>Informe o Sexo:</label>
        <div class="form-check mt-2">
            <input class="form-check-input" type="radio" name="radioSexo" id="radioSexoMasc" value="0">
            <label class="form-check-label" for="radioSexo">
                Masculino
            </label>
        </div>
        <div class="form-check mt-2">
            <input class="form-check-input" type="radio" name="radioSexo" id="radioSexoFem" value="1">
            <label class="form-check-label" for="radioSexo">
                Feminino
            </label>
        </div>
        <div class="form-check mt-2">
            <input class="form-check-input" type="radio" name="radioSexo" id="radioSexoOutro" value="2">
            <label class="form-check-label" for="radioSexo">
                Outro
            </label>
        </div>

        <!-- Select Opinião -->
        <div class="row mt-3">
            <div class="col-4 pt-1">
                <label for="selectOpiniao">Informe sua opinião sobre o filme:</label>
            </div>
            <div class="col-4">
                <select class="form-select" id="selectOpiniao" required>
                    <option selected>Escolha uma das opções</option>
                    <option value="0">Péssimo</option>
                    <option value="1">Regular</option>
                    <option value="2">Bom</option>
                    <option value="3">Ótimo</option>
                </select>
            </div>
        </div>

        <button class="btn btn-primary mt-3" type="submit">Enviar</button>
    </form>

    <div class="container mt-3 ps-0">
        <div class="btn btn-warning" onclick="finalizarPesquisa()">Visualizar resumo das respostas</div>
    </div>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
