<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Calculadora de IMC</h1>
        <form id="imcForm" class="row g-3">
            <div class="col-md-6">
                <label for="peso" class="form-label">Peso (kg):</label>
                <input type="number" class="form-control" id="peso" step="0.1" required>
            </div>
            <div class="col-md-6">
                <label for="altura" class="form-label">Altura (m):</label>
                <input type="number" class="form-control" id="altura" step="0.01" required>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Calcular IMC</button>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
