<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformar texto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <form class="container mt-5 pt-5" onsubmit="
        transformarTexto(event)">
        <div class="row mb-3">
            <div class="col-6">
                <label for="texto" class="form-label fw-bold">Texto:</label>
                <input type="text" class="form-control" id="texto" required>
            </div>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="radioDefault" id="rdMaiuscula" value=0>
            <label class="form-check-label" for="rdMaiuscula">
                Letra Maiúscula
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="radioDefault" id="rdMinuscula" value=1>
            <label class="form-check-label" for="rdMinuscula">
                Letra Minúscula
            </label>
        </div>

        <button class="btn btn-primary mt-3" type="submit">Enviar</button>
    </form>

    <script src="script.js"></script>
</body>

</html>
