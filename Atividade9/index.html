<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinco Funções</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

        * {
            font-family: "Montserrat", sans-serif;
        }
    </style>

</head>

<body>
    <div class="fs-1 text-center mt-3">
        Cinco Funções
    </div>

    <form class="container mt-5 mb-5 rounded shadow p-4 bg-light" onsubmit="aplic()">

        <!-- NUMEROS  -->
        <div class="row mt-2">
            <div class="col-3">
                Informe o 1º número:
            </div>
            <input class="col-1" type="number" id="num1">
        </div>
        <div class="row mt-2">
            <div class="col-3">
                Informe o 2º número:
            </div>
            <input class="col-1" type="number" id="num2">
        </div>
        <div class="row mt-2">
            <div class="col-3">
                Informe o 3º número:
            </div>
            <input class="col-1" type="number" id="num3">
        </div>

        <hr>
        <!-- PALINDROMO -->
        <div class="row mt-4">
            <div class="col-6">
                Informe uma palavra para verficarmos se é um Palíndromo:
            </div>
            <input class="col-6" type="text" id="stringPalindromo">
        </div>

        <hr>
        <!-- SUBCONJUNTO ERRO NAO E -->
        <div class="fs-3 text-center mt-3">
            Comparação de Palavras
        </div>
        <div class="row mt-4">
            <div class="col-4">
                Informe a 1º palavra:
            </div>
            <input class="col" type="text" id="plvr1">
        </div>
        <div class="row mt-4">
            <div class="col-4">
                Informe a 2º palavra:
            </div>
            <input class="col" type="text" id="plvr2">
        </div>

        <!-- DATA -->
        <div class="row mt-4">
            <div class="col-4">
                Informe uma data:
            </div>
            <input class="col-2" type="date" id="data">
        </div>

        <button class="btn btn-primary mt-3" type="submit">Enviar</button>
    </form>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
