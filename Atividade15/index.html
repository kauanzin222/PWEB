<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

        * {
            font-family: "Montserrat", sans-serif;
        }
    </style>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header class="container-fluid text-center mt-3">
        <article class="fs-2">Formulário Principal</article>
        <hr>
    </header>

    <form onsubmit="validarForm(event)" class="container-fluid p-4" name="form">
        <!-- Nome -->
        <div class="row mb-3">
            <div class="col-8">
                <label for="name" class="form-text mb-2">Nome</label>
                <input type="text" id="name" class="form-control" required>
            </div>
        </div>

        <!-- Email -->
        <div class="row mb-3">
            <div class="col-8">
                <label for="email" class="form-text mb-2">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>
        </div>

        <!-- Comentario -->
        <div class="row mb-3">
            <div class="col-8 input-group">
                <span class="input-group-text">Comentario</span>
                <textarea class="form-control" aria-label="With textarea" id="comentario"></textarea>
            </div>
        </div>

        <!-- Pesquisa -->
        <div class="row mt-5">
            <div class="col text-center fs-4">Pesquisa</div>
        </div>
        <div class="row mt-3 text-center">
            <p class="mb-3 fst-italic">Primeira vez na página?</p>
            <div class="d-flex col justify-content-center">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1" value="SIM"
                        checked>
                    <label class="form-check-label pe-3" for="radioDefault1">
                        Sim
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" value="NAO">
                    <label class="form-check-label" for="radioDefault2">
                        Não
                    </label>
                </div>
            </div>
        </div>

        <!-- Botões -->
        <div class="d-flex justify-content-center mt-3">
            <button class="btn btn-primary me-3" type="submit">Enviar</button><button class="btn btn-danger"
                type="reset">Limpar</button>
        </div>

    </form>

    <script src="script.js"></script>
</body>

</html>
