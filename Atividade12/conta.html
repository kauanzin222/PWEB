<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Dados da Conta</h1>
        <form id="contaForm" class="row g-3">
            <div class="col-md-12">
                <label for="nome" class="form-label fw-bold">Nome correntista:</label>
                <input type="text" class="form-control" id="nome" step="0.1" required>
            </div>
            <div class="col-md-6">
                <label for="banco" class="form-label fw-bold">Banco:</label>
                <input type="text" class="form-control" id="banco" step="0.01" required>
            </div>
            <div class="col-md-6">
                <label for="numero" class="form-label fw-bold">Número da conta:</label>
                <input type="number" class="form-control" id="numero" step="0.01" required>
            </div>
            <div class="col-md-6">
                <label for="saldo" class="form-label fw-bold">Saldo:</label>
                <input type="number" class="form-control" id="saldo" step="0.01" required>
            </div>
            <div class="col-12">
                <label class="fw-bold">Tipo de Conta:</label>
            </div>
            <div class="col-12 form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="radioCorrente" value="CORRENTE">
                <label class="form-check-label" for="radioCorrente">
                    Corrente
                </label>
            </div>
            <div class="col-12 form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="radioPoupanca" value="POUPANCA">
                <label class="form-check-label" for="radioPoupanca">
                    Poupança
                </label>
            </div>

            <div class="container" id="container"></div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">Enviar dados</button>
            </div>
        </form>

        <div class="col-12 mt-3">
            <button class="btn btn-primary" onclick="mostrarContas()">Mostrar contas enviadas</button>
        </div>

        <div class="container" id="resultContainer"></div>

        <a href="index.html"><button class="btn btn-info mt-3 mb-3">Deseja calcular a área de um retâgulo?</button></a>
    </div>




    <script src="script.js"></script>
</body>

</html>
