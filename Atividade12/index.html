<!DOCTYPE html>
<html lang="en">

<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Medidas do Retângulo</h1>
        <form id="retanguloForm" class="row g-3">
            <div class="col-md-6">
                <label for="base" class="form-label">Base (cm):</label>
                <input type="number" class="form-control" id="base" step="0.1" required>
            </div>
            <div class="col-md-6">
                <label for="altura" class="form-label">Altura (cm):</label>
                <input type="number" class="form-control" id="altura" step="0.01" required>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Calcular Área</button>
            </div>
        </form>

        <a href="conta.html"><button class="btn btn-info mt-3">Deseja realizar uma conta?</button></a>
    </div>
